            </div>
        </div>

        <div id="studentsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be injected here via JavaScript -->
        </div>

            <h3 class="text-lg font-medium text-gray-900">No students found</h3>

        </div>
    </div>

        let allStudents = [];

        function initApp() {
            parseData();
            renderCards(allStudents);
            setupSearch();
        }

        function parseData() {
            const lines = rawData.trim().split('\n');
            const uniqueMap = new Map();
            const regex = /^(\d+):([^\|]+)\s*\|\s*Name\s*=\s*(.*?)\s*\|\s*My Courses\s*=\s*\[(.*?)\]/;

            lines.forEach(line => {
                const match = line.match(regex);
                if (match) {
                    const id = match[1];
                    if (!uniqueMap.has(id)) {
                        
                        // Clean up messy HTML entities in courses
                        let rawCourses = match[4].replace(/&#x27;/g, "'").replace(/&amp;/g, "&");
                        // Optional: Remove duplicate course names for a single student if any
                        let courseArray = [...new Set(rawCourses.split(',').map(c => c.trim()))];

                        uniqueMap.set(id, {
                            id: id,
                            password: match[2].trim(),
                            name: match[3].trim(),
                            courses: courseArray
                        });
                    }
                }
            });
            allStudents = Array.from(uniqueMap.values());
            document.getElementById('totalCount').innerText = `Total: ${allStudents.length}`;
        }

        function renderCards(students) {
            const grid = document.getElementById('studentsGrid');
            const noResults = document.getElementById('noResults');
            
            if (students.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            let html = '';
            students.forEach(student => {
                let courseBadges = student.courses.map(course => {
                    return `<span class="inline-flex items-center px-2 py-1 rounded text-[11px] font-semibold border ${getBadgeStyle(course)} truncate max-w-full" title="${course}">
                        <i class="fa-solid fa-book-open mr-1.5 opacity-70"></i> ${course}
                    </span>`;
                }).join('');

                html += `
                <div class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-shadow duration-300 overflow-hidden flex flex-col border border-gray-200">
                    <!-- Card Header -->
                    <div class="p-5 border-b border-gray-100 bg-gray-50 flex justify-between items-start">
                        <div class="overflow-hidden">
                            <h2 class="text-lg font-bold text-gray-900 truncate" title="${student.name}">${student.name}</h2>
                            <div class="text-sm font-mono text-gray-600 mt-1 flex items-center gap-2">
                                <span class="bg-gray-200 text-gray-700 px-2 py-0.5 rounded text-xs"><i class="fa-solid fa-id-badge"></i> ${student.id}</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Card Body (Courses) -->
                    <div class="p-5 flex-grow bg-white">
                        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 flex items-center justify-between">
                            <span>Enrolled Courses</span>
                            <span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full">${student.courses.length}</span>
                        </div>
                        <div class="flex flex-col gap-2 max-h-36 overflow-y-auto custom-scrollbar pr-2">
                            ${courseBadges}
                        </div>
                    </div>

                    <!-- Card Footer -->
                    <div class="p-4 bg-gray-50 border-t border-gray-100">
                        <button onclick="copyFormattedDetails('${student.id}', '${student.password}', '${student.name}')" 
                                class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl transition-colors shadow-sm">
                            <i class="fa-solid fa-copy"></i> Copy Details
                        </button>
                    </div>
                </div>`;
            });

            grid.innerHTML = html;
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                const filtered = allStudents.filter(s => 
                    s.name.toLowerCase().includes(term) ||
                    s.id.includes(term) ||
                    s.courses.some(c => c.toLowerCase().includes(term))
                );
                renderCards(filtered);
            });
        }

        // Color coding for different types of courses
        function getBadgeStyle(courseName) {
            let name = courseName.toLowerCase();
            if (name.includes('engineering') || name.includes('ict')) {
                return 'bg-blue-50 text-blue-700 border-blue-200';
            } else if (name.includes('medical') || name.includes('dental') || name.includes('biology')) {
                return 'bg-green-50 text-green-700 border-green-200';
            } else if (name.includes('varsity') || name.includes('du') || name.includes('guccho')) {
                return 'bg-purple-50 text-purple-700 border-purple-200';
            } else if (name.includes('bcs')) {
                return 'bg-red-50 text-red-700 border-red-200';
            }
            return 'bg-amber-50 text-amber-700 border-amber-200';
        }

        // Formatting text for WhatsApp/Messenger sharing
        function copyFormattedDetails(id, password, name) {
            const textToCopy = `
 Udvash-Unmesh Login
 Name: ${name}
 Reg No: ${id}
 Password: ${password}`;

            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast();
            }).catch(err => {
                console.error('Could not copy text: ', err);
                alert("Failed to copy text. Please try manually.");
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2500);
        }

        // Run application
        window.onload = initApp;
    </script>
