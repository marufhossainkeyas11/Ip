                        </a>

                </div>

                </div>

            </div>
        </div>

    <!-- Details Modal -->
    <div id="studentModal" class="fixed inset-0 z-[100] hidden bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm">

            </div>
            <div class="p-5 space-y-3">
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <div class="overflow-hidden pr-2">
                        <p class="text-[10px] text-gray-500 font-bold uppercase mb-0.5">Name</p>
                        <p id="modalName" class="font-bold text-gray-900 truncate"></p>
                    </div>
                    <button onclick="copyText('modalName', 'Name')" class="text-teal-600 hover:bg-teal-100 p-2 rounded-md transition"><i class="fa-regular fa-copy"></i></button>
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <div>
                        <p class="text-[10px] text-gray-500 font-bold uppercase mb-0.5">Mobile Number</p>
                        <p id="modalId" class="font-mono font-bold text-gray-900"></p>
                    </div>
                    <button onclick="copyText('modalId', 'Mobile')" class="text-teal-600 hover:bg-teal-100 p-2 rounded-md transition"><i class="fa-regular fa-copy"></i></button>
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <div>
                        <p class="text-[10px] text-gray-500 font-bold uppercase mb-0.5">Password</p>
                        <p id="modalPass" class="font-mono font-bold text-gray-900"></p>
                    </div>
                    <button onclick="copyText('modalPass', 'Password')" class="text-teal-600 hover:bg-teal-100 p-2 rounded-md transition"><i class="fa-regular fa-copy"></i></button>
                </div>
            </div>
            <div class="p-4 bg-gray-50 border-t flex gap-3">
                <button onclick="closeModal('studentModal')" class="flex-1 border border-gray-300 hover:bg-gray-100 text-gray-700 font-bold py-2.5 rounded-xl transition">Close</button>

            </div>
        </div>
    </div>

    <!-- Available Courses Modal -->
    <div id="courseModal" class="fixed inset-0 z-[100] hidden bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm">

            <div class="p-4 bg-white border-t">

        `;

        let allStudents = [];
        let filteredStudents = [];
        let allUniqueCoursesList = [];
        let currentPage = 1;
        const itemsPerPage = 20;

        window.addEventListener("scroll", () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            document.getElementById("scrollProgress").style.width = (height > 0 ? (winScroll / height) * 100 : 0) + "%";
        });

        function initApp() {
            parseData();
            filteredStudents = [...allStudents];
            renderPage();
            setupSearch();
            renderCourseModalList();
        }

        function parseData() {
            const lines = rawData.trim().split('\n');
            const uniqueMap = new Map();
            const courseSet = new Set();

            lines.forEach(line => {
                const trimmedLine = line.trim();
                if (!trimmedLine) return; 

                const parts = trimmedLine.split(' | ');
                const firstColonIdx = parts[0].indexOf(':');
                if (firstColonIdx === -1) return; 
                
                const phone = parts[0].substring(0, firstColonIdx).trim();
                const password = parts[0].substring(firstColonIdx + 1).trim();

                let name = 'Unknown';
                let courses = [];

                for (let i = 1; i < parts.length; i++) {
                    const item = parts[i].trim();
                    if (item.startsWith('Name = ')) {
                        name = item.substring(7).trim();
                    } else if (item.startsWith('Course = ')) {
                        let cName = item.substring(9).trim();
                        courses.push(cName);
                        courseSet.add(cName);
                    }
                }

                if (!uniqueMap.has(phone)) {
                    uniqueMap.set(phone, {
                        id: phone,
                        password: password,
                        name: name,
                        courses: [...new Set(courses)]
                    });
                }
            });

            allStudents = Array.from(uniqueMap.values());
            allUniqueCoursesList = Array.from(courseSet).sort();
            
            document.getElementById('totalCount').innerText = allStudents.length;
            document.getElementById('uniqueCourseCount').innerText = allUniqueCoursesList.length;
        }

        function renderPage() {
            const grid = document.getElementById('studentsGrid');
            const noResults = document.getElementById('noResults');
            
            if (filteredStudents.length === 0) {
                grid.innerHTML = '';
                document.getElementById('pagination').innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const studentsToShow = filteredStudents.slice(startIndex, startIndex + itemsPerPage);

            let html = '';
            studentsToShow.forEach(student => {
                let courseHTML = student.courses.map(course => {
                    let safeCourse = course.replace(/'/g, "\\'").replace(/"/g, '&quot;'); // স্পেশাল ক্যারেক্টার ফিক্স
                    return `<div onclick="searchByCourse('${safeCourse}')" class="cursor-pointer hover:shadow-md hover:-translate-y-0.5 transition-all w-full text-left px-3 py-2 rounded-lg border text-xs font-semibold whitespace-normal leading-relaxed ${getBadgeStyle(course)}">
                        <i class="fa-solid fa-play-circle mr-1.5 opacity-70"></i> ${course}
                    </div>`;
                }).join('');


                html += `
                <div class="bg-white rounded-2xl shadow-[0_2px_10px_-3px_rgba(20,184,166,0.1)] overflow-hidden flex flex-col border border-gray-200">
                    <div class="p-5 border-b border-gray-100">
                        <h2 class="text-lg font-bold text-gray-900 truncate uppercase">${student.name}</h2>
                        <div class="inline-flex items-center gap-1.5 bg-teal-50 text-teal-700 px-2.5 py-1 rounded-md text-xs font-bold mt-2">
                            <i class="fa-solid fa-phone"></i> ${student.id}
                        </div>
                    </div>
                    
                    <div class="p-5 flex-grow bg-white">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Enrolled Courses</span>
                            <span class="w-6 h-6 flex items-center justify-center rounded-full bg-teal-100 text-teal-700 text-xs font-bold">${student.courses.length}</span>
                        </div>
                        <div class="flex flex-col gap-2 max-h-44 overflow-y-auto custom-scrollbar pr-2">
                            ${courseHTML}
                        </div>
                    </div>

                    <div class="p-4 border-t border-gray-100 flex gap-3">
                        <button onclick="openStudentModal('${student.id}')" class="flex-1 bg-white border-2 border-teal-600 text-teal-600 hover:bg-teal-50 font-bold py-2 rounded-xl transition flex justify-center items-center gap-2">
                            <i class="fa-solid fa-eye"></i> Details
                        </button>
                        <button onclick="copyFormattedDetails('${student.id}')" class="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 rounded-xl transition flex justify-center items-center gap-2">
                            <i class="fa-solid fa-copy"></i> Copy
                        </button>
                    </div>
                </div>`;
            });

            grid.innerHTML = html;
            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredStudents.length / itemsPerPage);
            const container = document.getElementById('pagination');
            let html = '';
        
            if (totalPages <= 1) { container.innerHTML = ''; return; }
        
            html += `<button onclick="changePage(1)" class="w-10 h-10 flex items-center justify-center rounded-lg border ${currentPage === 1 ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'bg-white hover:bg-teal-50 text-teal-600 font-bold'}" ${currentPage === 1 ? 'disabled' : ''} title="First Page"><i class="fa-solid fa-angles-left"></i></button>`;
            html += `<button onclick="changePage(${currentPage - 1})" class="w-10 h-10 flex items-center justify-center rounded-lg border ${currentPage === 1 ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'bg-white hover:bg-teal-50 text-teal-600 font-bold'}" ${currentPage === 1 ? 'disabled' : ''} title="Previous Page"><i class="fa-solid fa-chevron-left"></i></button>`;
        
            let start = Math.max(1, currentPage - 1);
            let end = Math.min(totalPages, currentPage + 1);
            
            if (currentPage === 1) end = Math.min(3, totalPages);
            if (currentPage === totalPages) start = Math.max(1, totalPages - 2);
        
            for (let i = start; i <= end; i++) {
                html += `<button onclick="changePage(${i})" class="w-10 h-10 flex items-center justify-center rounded-lg border font-bold transition-colors ${i === currentPage ? 'bg-teal-600 text-white border-teal-600' : 'bg-white text-gray-700 hover:bg-teal-50 hover:text-teal-600'}">${i}</button>`;
            }

            html += `<button onclick="changePage(${currentPage + 1})" class="w-10 h-10 flex items-center justify-center rounded-lg border ${currentPage === totalPages ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'bg-white hover:bg-teal-50 text-teal-600 font-bold'}" ${currentPage === totalPages ? 'disabled' : ''} title="Next Page"><i class="fa-solid fa-chevron-right"></i></button>`;
            html += `<button onclick="changePage(${totalPages})" class="w-10 h-10 flex items-center justify-center rounded-lg border ${currentPage === totalPages ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'bg-white hover:bg-teal-50 text-teal-600 font-bold'}" ${currentPage === totalPages ? 'disabled' : ''} title="Last Page"><i class="fa-solid fa-angles-right"></i></button>`;
        
            container.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setupSearch() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                filteredStudents = allStudents.filter(s => 
                    s.name.toLowerCase().includes(term) ||
                    s.id.includes(term) ||
                    s.courses.some(c => c.toLowerCase().includes(term))
                );
                currentPage = 1;
                renderPage();
            });
        }

        function searchByCourse(course) {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = course; // সার্চ বক্সে কোর্সের নাম বসিয়ে দেবে
            
            const term = course.toLowerCase().trim();
            filteredStudents = allStudents.filter(s => 
                s.name.toLowerCase().includes(term) ||
                s.id.includes(term) ||
                s.courses.some(c => c.toLowerCase().includes(term))
            );
            
            currentPage = 1;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' }); // স্ক্রল করে উপরে নিয়ে যাবে
        }
        
        function getBadgeStyle(courseName) {
            let name = courseName.toLowerCase();
            if (name.includes('photo') || name.includes('video')) return 'bg-blue-50 text-blue-700 border-blue-200';
            if (name.includes('seo') || name.includes('marketing') || name.includes('content')) return 'bg-green-50 text-green-700 border-green-200';
            if (name.includes('design') || name.includes('graphic') || name.includes('ui/ux')) return 'bg-purple-50 text-purple-700 border-purple-200';
            if (name.includes('data entry') || name.includes('excel')) return 'bg-orange-50 text-orange-700 border-orange-200';
            return 'bg-slate-50 text-slate-700 border-slate-200';
        }

        // Modals
        function openStudentModal(id) {
            const student = allStudents.find(s => s.id === id);
            if(student) {
                document.getElementById('modalName').innerText = student.name;
                document.getElementById('modalId').innerText = student.id;
                document.getElementById('modalPass').innerText = student.password;
                document.getElementById('modalCopyAllBtn').onclick = () => copyFormattedDetails(student.id);
                document.getElementById('studentModal').classList.remove('hidden');
            }
        }
        function openCourseModal() {
            document.getElementById('courseModal').classList.remove('hidden');
        }
        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function renderCourseModalList() {
            const container = document.getElementById('courseListContainer');
            if (allUniqueCoursesList.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-4">No courses available.</p>';
                return;
            }
            container.innerHTML = allUniqueCoursesList.map((c, i) => {
                let safeCourse = c.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                return `<li onclick="searchByCourse('${safeCourse}'); closeModal('courseModal')" class="cursor-pointer hover:bg-teal-50 hover:text-teal-700 transition-colors bg-white border border-gray-200 p-3 rounded-lg text-sm font-semibold text-gray-700 shadow-sm flex items-center gap-3">
                    <span class="w-6 h-6 rounded bg-teal-100 text-teal-600 flex items-center justify-center text-xs">${i+1}</span>
                    ${c}
                </li>`;
            }).join('');
        }

        // Copy Actions
        function copyText(elementId, label) {
            navigator.clipboard.writeText(document.getElementById(elementId).innerText).then(() => showToast(`${label} copied!`));
        }
        function copyFormattedDetails(id) {
            const student = allStudents.find(s => s.id === id);
            const textToCopy = `Ghoori Learning Login\nName: ${student.name}\nMobile: ${student.id}\nPassword: ${student.password}`;
            navigator.clipboard.writeText(textToCopy).then(() => showToast('All details copied!'));
        }
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2000);
        }

        window.onload = initApp;
    </script>
