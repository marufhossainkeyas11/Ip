        // Custom Parser for Ghoori Learning format
        function parseData() {
            const lines = rawData.trim().split('\n');
            const uniqueMap = new Map();

            lines.forEach(line => {
                const trimmedLine = line.trim();
                if (!trimmedLine) return; // Skip empty lines

                const parts = trimmedLine.split(' | ');
                
                // Extract credentials from the first part
                const firstColonIdx = parts[0].indexOf(':');
                if (firstColonIdx === -1) return; // Invalid format
                
                const phone = parts[0].substring(0, firstColonIdx).trim();
                const password = parts[0].substring(firstColonIdx + 1).trim();

                let name = 'Unknown';
                let courses = [];

                // Extract Name and Courses from the remaining parts
                for (let i = 1; i < parts.length; i++) {
                    const item = parts[i].trim();
                    if (item.startsWith('Name = ')) {
                        name = item.substring(7).trim(); // Remove "Name = "
                    } else if (item.startsWith('Course = ')) {
                        courses.push(item.substring(9).trim()); // Remove "Course = "
                    }
                }

                // Handling duplicates
                if (!uniqueMap.has(phone)) {
                    uniqueMap.set(phone, {
                        phone: phone,
                        password: password,
                        name: name,
                        courses: [...new Set(courses)] // Remove duplicate courses if any
                    });
                }
            });

            allStudents = Array.from(uniqueMap.values());
            document.getElementById('totalCount').innerText = `Total: ${allStudents.length}`;
        }

        function renderCards(students) {
            const grid = document.getElementById('studentsGrid');
            const noResults = document.getElementById('noResults');
            
            if (students.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            let html = '';
            students.forEach(student => {
                let courseBadges = student.courses.map(course => {
                    return `<span class="inline-flex items-center px-2 py-1 rounded text-[11px] font-semibold border ${getBadgeStyle(course)} max-w-full" title="${course}">
                        <i class="fa-solid fa-play-circle mr-1.5 opacity-70"></i> 
                        <span class="truncate block whitespace-normal break-words">${course}</span>
                    </span>`;
                }).join('');

                html += `
                <div class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-shadow duration-300 overflow-hidden flex flex-col border border-gray-200">
                    <!-- Card Header -->
                    <div class="p-5 border-b border-gray-100 bg-gray-50 flex justify-between items-start">
                        <div class="overflow-hidden w-full">
                            <h2 class="text-lg font-bold text-gray-900 truncate" title="${student.name}">${student.name}</h2>
                            <div class="text-sm font-mono text-gray-600 mt-1 flex items-center gap-2">
                                <span class="bg-teal-100 text-teal-800 px-2 py-0.5 rounded text-xs font-bold"><i class="fa-solid fa-phone"></i> ${student.phone}</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Card Body (Courses) -->
                    <div class="p-5 flex-grow bg-white">
                        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 flex items-center justify-between">
                            <span>Enrolled Courses</span>
                            <span class="bg-teal-50 border border-teal-100 text-teal-700 px-2 py-0.5 rounded-full">${student.courses.length}</span>
                        </div>
                        <div class="flex flex-col gap-2 max-h-40 overflow-y-auto custom-scrollbar pr-2">
                            ${courseBadges}
                        </div>
                    </div>

                    <!-- Card Footer -->
                    <div class="p-4 bg-gray-50 border-t border-gray-100">
                        <button onclick="copyFormattedDetails('${student.phone}', '${student.password}', '${student.name}')" 
                                class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-teal-600 hover:bg-teal-700 text-white text-sm font-bold rounded-xl transition-colors shadow-sm">
                            <i class="fa-solid fa-copy"></i> Copy Details
                        </button>
                    </div>
                </div>`;
            });

            grid.innerHTML = html;
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                const filtered = allStudents.filter(s => 
                    s.name.toLowerCase().includes(term) ||
                    s.phone.includes(term) ||
                    s.courses.some(c => c.toLowerCase().includes(term))
                );
                renderCards(filtered);
            });
        }

        // Color coding for different Ghoori course categories
        function getBadgeStyle(courseName) {
            let name = courseName.toLowerCase();
            
            if (name.includes('photo') || name.includes('video')) {
                return 'bg-blue-50 text-blue-700 border-blue-200';
            } else if (name.includes('seo') || name.includes('marketing') || name.includes('content')) {
                return 'bg-green-50 text-green-700 border-green-200';
            } else if (name.includes('design') || name.includes('graphic') || name.includes('ui/ux')) {
                return 'bg-purple-50 text-purple-700 border-purple-200';
            } else if (name.includes('data entry') || name.includes('excel') || name.includes('office')) {
                return 'bg-orange-50 text-orange-700 border-orange-200';
            }
            return 'bg-slate-50 text-slate-700 border-slate-200'; // Default
        }

        // Formatting text for WhatsApp/Messenger sharing
        function copyFormattedDetails(phone, password, name) {
            const textToCopy = 
` Ghoori Learning Login
 Name: ${name}
 Mobile: ${phone}
 Password: ${password}`;

            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast();
            }).catch(err => {
                console.error('Could not copy text: ', err);
                alert("Failed to copy text. Please try manually.");
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2500);
        }

        // Run application
        window.onload = initApp;
    </script>
</body>
</html>
