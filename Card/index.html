
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Student ID Generator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* Base styles */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        
        /* 
           REQUIREMENT 1: STRICT CARD DIMENSIONS
           No max-width, no percentages. Fixed 350x550.
        */
        #id-card {
            width: 350px;
            height: 550px;
            background-color: #ffffff;
            position: relative; /* Context for absolute children */
            box-sizing: border-box;
            border-radius: 12px;
            overflow: hidden; /* For rounded corners only */
            /* REQUIREMENT 4: Safe standard fonts */
            font-family: Arial, Helvetica, sans-serif; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid #cbd5e1;
        }

        /* 
           REQUIREMENT 3: ABSOLUTE POSITIONING FOR ALL ELEMENTS
           Every single element inside the card has exact coordinates.
        */
        .abs-header-bg {
            position: absolute; top: 0px; left: 0px; width: 350px; height: 100px;
            background-color: #1e3a8a; /* Deep blue */
        }
        
        .abs-logo-box {
            position: absolute; top: 15px; left: 20px; width: 70px; height: 70px;
            background-color: white; border-radius: 50%; padding: 3px; border: 2px solid white;
            box-sizing: border-box;
        }
        .abs-logo-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
        
        .abs-college-name {
            position: absolute; top: 22px; left: 105px; width: 225px;
            color: #ffffff; font-size: 16px; font-weight: 800; line-height: 1.3;
        }
        .abs-subtitle {
            position: absolute; top: 65px; left: 105px; width: 225px;
            color: #93c5fd; font-size: 10px; font-weight: bold; letter-spacing: 1px;
        }

        .abs-photo-box {
            position: absolute; top: 115px; left: 110px; width: 130px; height: 150px;
            background-color: #f1f5f9; border: 3px solid #f8fafc; border-radius: 10px;
            overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .abs-photo-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        /* 
           REQUIREMENT 2: BADGE FIX
           Using Flexbox for perfect vertical and horizontal centering.
           Removed strict line-height that was causing the cutoff.
        */
        .abs-badge {
            position: absolute; top: 252px; left: 125px; width: 100px; height: 28px;
            background-color: #3b82f6; color: white;
            border-radius: 14px; font-size: 12px; font-weight: bold; letter-spacing: 1px;
            border: 2px solid white; box-sizing: border-box;
            display: flex; justify-content: center; align-items: center; /* PERFECT CENTERING */
            z-index: 10;
        }

        .abs-student-name {
            position: absolute; top: 295px; left: 15px; width: 320px;
            text-align: center; color: #0f172a; font-size: 24px; font-weight: 900;
        }
        .abs-id-number {
            position: absolute; top: 325px; left: 15px; width: 320px;
            text-align: center; color: #64748b; font-size: 14px; font-weight: bold;
        }

        /* Strict mapping for details to prevent overlap */
        .abs-label-dob { position: absolute; top: 370px; left: 30px; width: 50px; font-size: 12px; color: #64748b; font-weight: bold; }
        .abs-val-dob { position: absolute; top: 370px; left: 120px; width: 200px; text-align: right; font-size: 14px; font-weight: 800; color: #0f172a; }
        
        .abs-divider-1 { position: absolute; top: 395px; left: 30px; width: 290px; height: 1px; background-color: #e2e8f0; }
        
        .abs-label-course { position: absolute; top: 410px; left: 30px; width: 70px; font-size: 12px; color: #64748b; font-weight: bold; }
        .abs-val-course { position: absolute; top: 410px; left: 110px; width: 210px; text-align: right; font-size: 14px; font-weight: 800; color: #0f172a; }

        /* Bottom Section Mapping */
        .abs-barcode-box {
            position: absolute; top: 455px; left: 30px; width: 90px; height: 35px;
            display: flex; align-items: flex-end;
        }
        .abs-sig-img { 
            position: absolute; top: 445px; left: 200px; width: 120px; height: 35px; 
            object-fit: contain; display: block;
        }
        .abs-sig-line { 
            position: absolute; top: 482px; left: 200px; width: 120px; height: 1px; 
            background-color: #94a3b8; 
        }
        .abs-sig-text { 
            position: absolute; top: 487px; left: 200px; width: 120px; 
            text-align: center; font-size: 10px; color: #64748b; font-weight: bold; letter-spacing: 0.5px;
        }

        .abs-footer-bg {
            position: absolute; top: 505px; left: 0; width: 350px; height: 45px;
            background-color: #dc2626; /* Red */
        }
        .abs-footer-text {
            position: absolute; top: 505px; left: 0; width: 350px; height: 45px;
            color: #ffffff; font-size: 14px; font-weight: bold; letter-spacing: 1px;
            display: flex; justify-content: center; align-items: center;
        }

        /* App UI Specific */
        .preview-wrapper {
            transition: transform 0.2s ease-out;
            transform-origin: center center;
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row overflow-hidden">

    <div class="w-full md:w-[420px] h-[45vh] md:h-full bg-white border-r border-gray-200 shadow-xl flex flex-col z-20">
        <div class="p-5 border-b border-gray-200 bg-slate-900 text-white">
            <h1 class="text-xl font-black tracking-wide">ID GENERATOR</h1>
            <p class="text-xs text-slate-400 font-medium mt-1">Strict Absolute Positional Layout</p>
        </div>

        <div class="p-5 overflow-y-auto custom-scroll flex-1 space-y-6 bg-slate-50">
            
            <!-- REQUIREMENT 5: Inputs -->
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                <h3 class="text-xs font-black text-indigo-600 uppercase mb-4 tracking-wider">Institution</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">College Name</label>
                        <input type="text" id="inpCollege" value="GLOBAL INTERNATIONAL COLLEGE" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none uppercase font-semibold text-gray-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">College Logo</label>
                        <input type="file" id="inpLogo" accept="image/*" class="w-full text-xs text-gray-600 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-indigo-50 file:text-indigo-700 file:font-semibold hover:file:bg-indigo-100 cursor-pointer border border-gray-200 rounded-md bg-gray-50">
                    </div>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                <h3 class="text-xs font-black text-indigo-600 uppercase mb-4 tracking-wider">Student Details</h3>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">First Name</label>
                        <input type="text" id="inpFirst" value="MARUF" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:border-indigo-500 outline-none uppercase font-semibold text-gray-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Last Name</label>
                        <input type="text" id="inpLast" value="HOSSAIN" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:border-indigo-500 outline-none uppercase font-semibold text-gray-800">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Student Photo</label>
                    <input type="file" id="inpPhoto" accept="image/*" class="w-full text-xs text-gray-600 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-indigo-50 file:text-indigo-700 file:font-semibold hover:file:bg-indigo-100 cursor-pointer border border-gray-200 rounded-md bg-gray-50">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Course Name</label>
                    <input type="text" id="inpCourse" value="UNDERGRADUATE" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:border-indigo-500 outline-none uppercase font-semibold text-gray-800">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Date of Birth</label>
                        <input type="text" id="inpDOB" value="15 AUG 2005" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:border-indigo-500 outline-none uppercase font-semibold text-gray-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Valid Until Year</label>
                        <input type="text" id="inpExpiry" value="2027" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:border-indigo-500 outline-none font-semibold text-gray-800">
                    </div>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-10">
                <h3 class="text-xs font-black text-indigo-600 uppercase mb-4 tracking-wider">Authorization</h3>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Principal Signature</label>
                    <input type="file" id="inpSignature" accept="image/*" class="w-full text-xs text-gray-600 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-indigo-50 file:text-indigo-700 file:font-semibold hover:file:bg-indigo-100 cursor-pointer border border-gray-200 rounded-md bg-gray-50">
                </div>
            </div>
        </div>
    </div>

    <div id="previewContainer" class="flex-1 h-[55vh] md:h-full flex flex-col justify-center items-center relative bg-gray-200">
        
        <!-- Scalable wrapper purely for UI fitting -->
        <div id="cardWrapper" class="preview-wrapper relative z-10 flex justify-center items-center">
            
            <!-- THE ACTUAL ID CARD (Fixed 350x550) -->
            <div id="id-card">
                
                <div class="abs-header-bg"></div>
                
                <div class="abs-logo-box">
                    <img id="outLogo" class="abs-logo-img" src="https://placehold.co/150x150/ffffff/1e40af?text=LOGO" alt="Logo">
                </div>
                <div id="outCollege" class="abs-college-name">GLOBAL INTERNATIONAL COLLEGE</div>
                <div class="abs-subtitle">STUDENT IDENTITY CARD</div>

                <div class="abs-photo-box">
                    <img id="outPhoto" class="abs-photo-img" src="https://placehold.co/300x400/e2e8f0/64748b?text=PHOTO" alt="Student">
                </div>
                
                <div class="abs-badge">STUDENT</div>
                
                <div id="outName" class="abs-student-name">MARUF HOSSAIN</div>
                <div class="abs-id-number">ID: <span id="outIDNumber">STU-1234567</span></div>

                <div class="abs-label-dob">DOB</div>
                <div id="outDOB" class="abs-val-dob">15 AUG 2005</div>
                
                <div class="abs-divider-1"></div>
                
                <div class="abs-label-course">COURSE</div>
                <div id="outCourse" class="abs-val-course">UNDERGRADUATE</div>

                <!-- Pure CSS Barcode structure to avoid external font dependencies -->
                <div class="abs-barcode-box">
                    <div style="width: 3px; height: 100%; background: #0f172a; margin-right: 2px;"></div>
                    <div style="width: 5px; height: 100%; background: #0f172a; margin-right: 2px;"></div>
                    <div style="width: 2px; height: 100%; background: #0f172a; margin-right: 3px;"></div>
                    <div style="width: 4px; height: 100%; background: #0f172a; margin-right: 2px;"></div>
                    <div style="width: 1px; height: 100%; background: #0f172a; margin-right: 2px;"></div>
                    <div style="width: 6px; height: 100%; background: #0f172a; margin-right: 4px;"></div>
                    <div style="width: 2px; height: 100%; background: #0f172a; margin-right: 1px;"></div>
                    <div style="width: 3px; height: 100%; background: #0f172a; margin-right: 3px;"></div>
                    <div style="width: 2px; height: 100%; background: #0f172a; margin-right: 2px;"></div>
                    <div style="width: 4px; height: 100%; background: #0f172a; margin-right: 1px;"></div>
                    <div style="width: 1px; height: 100%; background: #0f172a; margin-right: 3px;"></div>
                    <div style="width: 5px; height: 100%; background: #0f172a;"></div>
                </div>

                <img id="outSignature" class="abs-sig-img" src="https://placehold.co/200x80/ffffff/0f172a?text=Sign" alt="Signature">
                <div class="abs-sig-line"></div>
                <div class="abs-sig-text">PRINCIPAL</div>

                <div class="abs-footer-bg"></div>
                <div id="outExpiry" class="abs-footer-text">VALID UNTIL: 2027</div>

            </div>
        </div>

        <button id="btnDownload" class="absolute bottom-6 bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-8 rounded-full shadow-2xl transition-all transform active:scale-95 z-30 flex items-center gap-2 border border-slate-700">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            <span id="btnText">Export ID Card</span>
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Generate Random Student ID Number
            document.getElementById('outIDNumber').textContent = 'STU-' + Math.floor(1000000 + Math.random() * 9000000);

            const cardWrapper = document.getElementById('cardWrapper');
            const previewContainer = document.getElementById('previewContainer');
            
            // Function to scale the card purely for visual fit in the UI without modifying actual DOM size
            const fitCardToScreen = () => {
                const areaW = previewContainer.clientWidth;
                const areaH = previewContainer.clientHeight;
                const maxW = areaW - 40;
                const maxH = areaH - 120; // Room for button
                
                const scaleW = maxW / 350;
                const scaleH = maxH / 550;
                
                let scale = Math.min(scaleW, scaleH);
                if (scale > 1) scale = 1; 
                
                cardWrapper.style.transform = `scale(${scale})`;
            };

            window.addEventListener('resize', fitCardToScreen);
            fitCardToScreen();
            setTimeout(fitCardToScreen, 100);

            // Bind Text Inputs
            const bindInput = (inpId, outId, isUpper = true, prefix = '') => {
                const inputEl = document.getElementById(inpId);
                const outputEl = document.getElementById(outId);
                inputEl.addEventListener('input', () => {
                    let val = inputEl.value.trim();
                    if(isUpper) val = val.toUpperCase();
                    outputEl.textContent = prefix + val;
                });
            };

            bindInput('inpCollege', 'outCollege', true);
            bindInput('inpCourse', 'outCourse', true);
            bindInput('inpDOB', 'outDOB', true);
            bindInput('inpExpiry', 'outExpiry', true, 'VALID UNTIL: ');

            const updateFullName = () => {
                const first = document.getElementById('inpFirst').value.trim();
                const last = document.getElementById('inpLast').value.trim();
                document.getElementById('outName').textContent = `${first} ${last}`.toUpperCase();
            };
            document.getElementById('inpFirst').addEventListener('input', updateFullName);
            document.getElementById('inpLast').addEventListener('input', updateFullName);

            // Bind Image Uploads
            const bindImage = (inpId, outId) => {
                document.getElementById(inpId).addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            document.getElementById(outId).src = event.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                });
            };

            bindImage('inpLogo', 'outLogo');
            bindImage('inpPhoto', 'outPhoto');
            bindImage('inpSignature', 'outSignature');

            // REQUIREMENT 6: Precise Export Logic
            const btnDownload = document.getElementById('btnDownload');
            const btnText = document.getElementById('btnText');
            
            btnDownload.addEventListener('click', () => {
                const targetCard = document.getElementById('id-card');
                
                // Loading State
                btnDownload.disabled = true;
                btnDownload.classList.add('opacity-50', 'cursor-not-allowed');
                btnText.textContent = "Processing image...";
                
                // Temporarily remove scaling so html2canvas captures 1:1 at 350x550
                const currentTransform = cardWrapper.style.transform;
                cardWrapper.style.transform = 'scale(1)';
                
                // Wait 500ms for browser DOM to repaint unscaled version
                setTimeout(() => {
                    html2canvas(targetCard, {
                        scale: 3, // Multiplier for high resolution output
                        useCORS: true,
                        backgroundColor: '#ffffff',
                        logging: false
                    }).then(canvas => {
                        // Restore Scale
                        cardWrapper.style.transform = currentTransform;
                        
                        // Download
                        const link = document.createElement('a');
                        const fName = document.getElementById('inpFirst').value.trim() || 'Student';
                        link.download = `ID_${fName}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        
                        // Reset State
                        btnDownload.disabled = false;
                        btnDownload.classList.remove('opacity-50', 'cursor-not-allowed');
                        btnText.textContent = "Export ID Card";
                        
                    }).catch(err => {
                        console.error(err);
                        cardWrapper.style.transform = currentTransform;
                        btnDownload.disabled = false;
                        btnDownload.classList.remove('opacity-50', 'cursor-not-allowed');
                        btnText.textContent = "Export Failed";
                        alert("An error occurred during export.");
                    });
                }, 500); 
            });
        });
    </script>
</body>
</html>
